
name: Git Koi

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate koi
        uses: actions/checkout@v4

      - name: Draw GitHub Koi
        uses: yalongwastaken/git-koi@v1

      - name: Commit koi
        run: |
          if [ -n "$(git status --porcelain koi/koi.gif)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add koi/koi.gif
            git commit -m "Update GitHub koi"
            git push
          fi
